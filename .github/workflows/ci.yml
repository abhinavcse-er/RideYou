name: RideYou checks
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspaces
        run: npm install
      - name: Check server JavaScript syntax
        run: find server -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run server policy tests
        run: npm test
      - name: Build responsive web app
        run: npm run build
